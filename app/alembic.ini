# ==============================================================================
# Configuración de Alembic para el Sistema de Autenticación, RBAC y Auditoría
# Ejecutar desde la raíz del proyecto:
#   alembic -c app/alembic.ini upgrade head
# ==============================================================================

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
version_path_separator = os
sqlalchemy.url = sqlite+aiosqlite:///./data/authsec.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
